name: build

# Fyne 桌面版必须 CGO 编译，因此两个产物都在对应架构的 runner 上原生构建。
# 产物在本次运行的 Artifacts 里下载。
on:
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  GO_VERSION: "1.26.4"

jobs:
  linux-arm64:
    name: Linux arm64（Debian 11 / glibc 2.31）
    runs-on: ubuntu-22.04-arm # 原生 aarch64 runner
    container: debian:11 # glibc 2.31，兼容麒麟 OS 等较老 ARM 系统
    steps:
      - name: 装基础工具与 Fyne 依赖
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            curl ca-certificates git file binutils pkg-config gcc g++ make \
            libgl1-mesa-dev libglu1-mesa-dev xorg-dev \
            libxkbcommon-dev libfontconfig1-dev libfreetype6-dev \
            libwayland-dev wayland-protocols libwayland-egl-backend-dev libdecor-0-dev

      - name: 安装 Go ${{ env.GO_VERSION }}
        run: |
          curl -fsSL "https://go.dev/dl/go${GO_VERSION}.linux-arm64.tar.gz" -o /tmp/go.tar.gz
          rm -rf /usr/local/go && tar -C /usr/local -xzf /tmp/go.tar.gz
          echo "/usr/local/go/bin" >> "$GITHUB_PATH"

      - uses: actions/checkout@v4

      - name: 允许 go 读取容器内的仓库
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: 单元测试（不依赖内核资源）
        run: go test ./internal/...

      - name: 编译
        env:
          CGO_ENABLED: "1"
        run: |
          mkdir -p dist
          go build -trimpath -buildvcs=false -ldflags "-s -w" -o dist/buslab ./cmd/buslab
          file dist/buslab
          echo "最高 GLIBC 依赖："
          objdump -T dist/buslab | grep -o 'GLIBC_[0-9.]*' | sort -Vu | tail -n 3

      - uses: actions/upload-artifact@v4
        with:
          name: buslab-linux-arm64
          path: dist/buslab
          if-no-files-found: error

  windows-amd64:
    name: Windows amd64（界面预览，后端为内存模拟）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: 确认 C 编译器
        shell: pwsh
        run: |
          if (-not (Get-Command gcc -ErrorAction SilentlyContinue)) {
            choco install mingw -y --no-progress
            echo "C:\ProgramData\mingw64\mingw64\bin" >> $env:GITHUB_PATH
          }
          gcc --version

      - name: 编译
        shell: pwsh
        env:
          CGO_ENABLED: "1"
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          go build -trimpath -ldflags "-s -w -H windowsgui" -o dist/buslab.exe ./cmd/buslab

      - uses: actions/upload-artifact@v4
        with:
          name: buslab-windows-amd64
          path: dist/buslab.exe
          if-no-files-found: error
